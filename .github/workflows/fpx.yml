name: FPX gateway checks
on:
  push:
    paths: ['supabase/functions/**', 'supabase/tests/fpx_edge.test.mjs', '.github/workflows/fpx.yml']
  pull_request:
    paths: ['supabase/functions/**', 'supabase/tests/fpx_edge.test.mjs', '.github/workflows/fpx.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test supabase/tests/fpx_edge.test.mjs
