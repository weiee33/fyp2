name: Admin checks
on:
  push:
    paths: ['admin/**', 'scripts/*Admin*.ps1', '.github/workflows/admin.yml']
  pull_request:
    paths: ['admin/**', 'scripts/*Admin*.ps1', '.github/workflows/admin.yml']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, fileinfo, dom
          coverage: none
      - name: Install locked report dependencies
        run: composer install --working-dir=admin --no-interaction --prefer-dist --no-dev
      - name: Check PHP syntax
        run: find admin -path admin/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check browser script syntax
        run: |
          node --check admin/public/assets/admin.js
          node --check admin/public/assets/analytics-chart.js
      - name: Test chart inspection and viewport boundaries
        run: node --test admin/tests/analytics_chart.test.cjs
      - name: Test isolated admin workflows
        run: php admin/tests/run.php
