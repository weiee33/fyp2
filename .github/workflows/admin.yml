name: Admin checks
on:
  push:
    paths: ['admin/**', '.github/workflows/admin.yml']
  pull_request:
    paths: ['admin/**', '.github/workflows/admin.yml']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, fileinfo
          coverage: none
      - name: Check PHP syntax
        run: find admin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test isolated admin workflows
        run: php admin/tests/run.php
