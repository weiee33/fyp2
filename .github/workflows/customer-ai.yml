name: Customer AI checks
on:
  push:
    paths: ['supabase/functions/customer-assistant/**', 'supabase/functions/customer-visual-agent/**', 'supabase/functions/_shared/customer_visual_agent.ts', 'supabase/tests/customer_visual_agent_edge.test.mjs', 'supabase/functions/_shared/customer_ai.ts', 'supabase/functions/_shared/customer_ai_scope.ts', 'supabase/functions/_shared/customer_ai_router.ts', 'supabase/tests/customer_ai_router.test.mjs', 'supabase/tests/customer_ai_edge.test.mjs', '.github/workflows/customer-ai.yml']
  pull_request:
    paths: ['supabase/functions/customer-assistant/**', 'supabase/functions/customer-visual-agent/**', 'supabase/functions/_shared/customer_visual_agent.ts', 'supabase/tests/customer_visual_agent_edge.test.mjs', 'supabase/functions/_shared/customer_ai.ts', 'supabase/functions/_shared/customer_ai_scope.ts', 'supabase/functions/_shared/customer_ai_router.ts', 'supabase/tests/customer_ai_router.test.mjs', 'supabase/tests/customer_ai_edge.test.mjs', '.github/workflows/customer-ai.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test supabase/tests/customer_ai_edge.test.mjs supabase/tests/customer_visual_agent_edge.test.mjs supabase/tests/customer_ai_router.test.mjs
      - run: npx --yes --package typescript@5.9.3 tsc --noEmit --allowImportingTsExtensions --module esnext --target es2022 --lib es2022,dom --moduleResolution bundler supabase/functions/_shared/customer_ai_router.ts supabase/functions/_shared/customer_ai.ts supabase/functions/_shared/customer_ai_scope.ts supabase/functions/_shared/customer_visual_agent.ts
