name: Customer AI checks
on:
  push:
    paths: ['supabase/functions/customer-assistant/**', 'supabase/functions/_shared/customer_ai.ts', 'supabase/tests/customer_ai_edge.test.mjs', '.github/workflows/customer-ai.yml']
  pull_request:
    paths: ['supabase/functions/customer-assistant/**', 'supabase/functions/_shared/customer_ai.ts', 'supabase/tests/customer_ai_edge.test.mjs', '.github/workflows/customer-ai.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test supabase/tests/customer_ai_edge.test.mjs
